schema_version = "1.0.0"

id = "claude2blender"
version = "0.8.1"
name = "Claude2Blender"
tagline = "Reviewable product studio workflows with Claude or Codex"
maintainer = "Talus"
type = "add-on"

blender_version_min = "5.0.0"

license = ["SPDX:GPL-3.0-or-later"]

tags = ["User Interface", "Material", "Lighting", "Render"]

[permissions]
files = "Reads your reference images and texture packs, writes temp files"
clipboard = "Copies the request for Claude Desktop (optional fallback)"
network = "Runs signed-in agent CLIs and a paired localhost companion"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".*"]
